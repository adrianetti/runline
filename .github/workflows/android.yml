name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android tests, lint and APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.package_version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read package version
        id: package_version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib, re
          source = pathlib.Path('app/build.gradle.kts').read_text()
          print('version=' + re.search(r'versionName = "([0-9.]+)"', source).group(1))
          PY
      - name: Prepare stable app signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SIGNING_KEY: ${{ secrets.RUNLINE_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.RUNLINE_SIGNING_PASSWORD }}
        run: |
          umask 077
          test -n "$SIGNING_KEY"
          test -n "$SIGNING_PASSWORD"
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/runline.jks"
          printf 'RUNLINE_STORE_FILE=%s/runline.jks\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'RUNLINE_SIGNING_PASSWORD=%s\n' "$SIGNING_PASSWORD" >> "$GITHUB_ENV"
      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Verify icon sources
        run: python3 tools/import_icons.py --check
      - name: Test, lint and build
        run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest assembleRelease lintDebug --no-daemon
      - name: Check native GPX import on Android 14
        timeout-minutes: 15
        run: |
          sudo chmod a+rw /dev/kvm
          sdkmanager 'emulator' 'system-images;android-34;google_apis;x86_64'
          printf 'no\n' | avdmanager create avd --name import-check --device pixel_5 --package 'system-images;android-34;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd import-check -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          trap 'adb emu kill || true' EXIT
          adb wait-for-device
          timeout 180 bash -c 'until adb shell getprop sys.boot_completed | tr -d "\r" | grep -q 1; do sleep 2; done'
          adb shell input keyevent 224
          adb shell wm dismiss-keyguard
          adb shell svc power stayon true
          adb shell settings put system screen_off_timeout 1800000
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          ./gradlew connectedDebugAndroidTest --no-daemon
          python3 tools/android_import_smoke.py
      - name: Upload native import captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Native-import-${{ github.run_number }}
          path: |
            .impeccable/review/
            app/build/outputs/androidTest-results/
            ${{ runner.temp }}/emulator.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Runline-${{ github.event_name == 'push' && 'signed' || 'review-only' }}-${{ github.run_number }}
          path: ${{ github.event_name == 'push' && 'app/build/outputs/apk/release/app-release.apk' || 'app/build/outputs/apk/debug/app-debug.apk' }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Android-checks-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  draft:
    name: Prepare draft release for verification
    needs: build
    # Manual review builds can expose diagnostic captures even when the smoke check fails.
    # Signed release candidates require a successful main-branch build and stay unpublished.
    if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.result == 'success'))
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PACKAGE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Stage review assets in a draft
        run: |
          gh run download "$GITHUB_RUN_ID" --pattern 'Native-import-*' --dir native
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="v$PACKAGE_VERSION"
            title="Runline $PACKAGE_VERSION"
          else
            tag="review-${GITHUB_SHA:0:8}"
            title="Runline review ${GITHUB_SHA:0:8}"
          fi
          if gh release view "$tag" --json isDraft --jq .isDraft > draft-state 2>/dev/null; then
            if [ "$(cat draft-state)" != true ]; then
              echo 'A published release already exists; keeping its assets unchanged.'
              exit 0
            fi
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft --title "$title" --notes 'Verification build. Native captures use synthetic data. Publication follows source checks and signed APK verification.'
          fi
          mapfile -t images < <(rg --files --hidden native | rg '\.png$')
          if [ "${#images[@]}" -gt 0 ]; then
            gh release upload "$tag" "${images[@]}" --clobber
          fi
          if gh run download "$GITHUB_RUN_ID" --pattern 'Runline-*' --dir package; then
            mapfile -t apks < <(rg --files --hidden package | rg '\.apk$')
            test "${#apks[@]}" -eq 1
            cp "${apks[0]}" "Runline-$PACKAGE_VERSION.apk"
            gh release upload "$tag" "Runline-$PACKAGE_VERSION.apk" --clobber
          else
            test "$GITHUB_EVENT_NAME" != push
          fi
