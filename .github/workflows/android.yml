name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android tests, lint and APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare stable app signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SIGNING_KEY: ${{ secrets.RUNLINE_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.RUNLINE_SIGNING_PASSWORD }}
        run: |
          umask 077
          test -n "$SIGNING_KEY"
          test -n "$SIGNING_PASSWORD"
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/runline.jks"
          printf 'RUNLINE_STORE_FILE=%s/runline.jks\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'RUNLINE_SIGNING_PASSWORD=%s\n' "$SIGNING_PASSWORD" >> "$GITHUB_ENV"
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Verify icon sources
        run: python3 tools/import_icons.py --check
      - name: Test, lint and build
        run: ./gradlew testDebugUnitTest assembleDebug assembleRelease lintDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Runline-${{ github.event_name == 'push' && 'signed' || 'review-only' }}-${{ github.run_number }}
          path: ${{ github.event_name == 'push' && 'app/build/outputs/apk/release/app-release.apk' || 'app/build/outputs/apk/debug/app-debug.apk' }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Android-checks-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
