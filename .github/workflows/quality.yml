name: Repository quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    name: Resources and wrapper
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Check bilingual resources
        run: python3 tools/check_resources.py
      - name: Verify pinned icon sources
        run: python3 tools/import_icons.py --check
      - name: Reject whitespace errors
        # Compare against Git’s empty tree, including every file in PR merge commits.
        run: git -c core.whitespace=trailing-space,space-before-tab,cr-at-eol diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD
  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified actionlint
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 --output actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
      - name: Validate GitHub Actions workflows
        run: '"$RUNNER_TEMP/actionlint" -color'
