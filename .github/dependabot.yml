version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    groups:
      android-libraries:
        applies-to: version-updates
        patterns:
          - 'androidx.*'
          - 'com.google.android.material:*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
